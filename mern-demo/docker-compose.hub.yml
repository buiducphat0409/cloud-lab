services:
  backend:
    image: buiducphat0409/mern-backend:1.0
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
    networks:
      - mern-network

  frontend:
    image: buiducphat0409/mern-frontend:1.0
    container_name: mern-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge
